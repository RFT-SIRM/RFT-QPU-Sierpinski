<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">RFT-QPU architecture flow</title>
<desc id="desc">Research flow from a self-similar Sierpinski graph through SU(2) edge transport and a candidate two-dimensional logical subspace to a proposed transmon tile and measured hardware gates.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b31"/><stop offset="1" stop-color="#1a2c49"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#53d6c2"/><stop offset="1" stop-color="#8caeff"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="#a6bddb"/></marker>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<text x="52" y="54" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">RFT-QPU-Sierpinski · research-to-device pathway</text>
<text x="52" y="82" fill="#aabbd3" font-family="Arial,sans-serif" font-size="15">Mathematical architecture → finite model → physical implementation → experimental qualification</text>
<g font-family="Arial,sans-serif">
  <rect x="48" y="132" width="202" height="192" rx="17" fill="#1d3557" stroke="#537aa7"/>
  <g stroke="#81b5e8" stroke-width="3" fill="none">
    <path d="M96 191 L201 191 L148 278 Z M96 191 L148 278 M201 191 L148 278"/>
    <path d="M122 234 L174 234 M122 234 L148 278 M174 234 L148 278" stroke="#53d6c2"/>
  </g>
  <g fill="#eaf2ff"><circle cx="96" cy="191" r="7"/><circle cx="201" cy="191" r="7"/><circle cx="148" cy="278" r="7"/><circle cx="122" cy="234" r="6"/><circle cx="174" cy="234" r="6"/></g>
  <text x="149" y="158" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Self-similar graph</text>
  <text x="149" y="303" text-anchor="middle" fill="#b8cbe1" font-size="12">Sierpiński connectivity</text>
  <path d="M257 228 L286 228" stroke="#a6bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="296" y="132" width="202" height="192" rx="17" fill="#1d3557" stroke="#537aa7"/>
  <circle cx="397" cy="218" r="42" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <path d="M397 168 L397 268 M347 218 L447 218" stroke="#8caeff" stroke-width="2" opacity=".8"/>
  <text x="397" y="158" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">SU(2) transport</text>
  <text x="397" y="207" text-anchor="middle" fill="#ffffff" font-size="15">X · Y · Z</text>
  <text x="397" y="303" text-anchor="middle" fill="#b8cbe1" font-size="12">Non-commuting links</text>
  <path d="M505 228 L534 228" stroke="#a6bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="544" y="132" width="202" height="192" rx="17" fill="#1d3557" stroke="#537aa7"/>
  <path d="M589 197 L633 174 L678 197 L678 246 L633 270 L589 246 Z" fill="none" stroke="#53d6c2" stroke-width="3"/>
  <path d="M589 197 L678 246 M678 197 L589 246" stroke="#8caeff" stroke-width="2"/>
  <text x="645" y="158" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Candidate subspace</text>
  <text x="633" y="224" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">dim = 2</text>
  <text x="645" y="303" text-anchor="middle" fill="#b8cbe1" font-size="12">Projected controls</text>
  <path d="M753 228 L782 228" stroke="#a6bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="792" y="132" width="202" height="192" rx="17" fill="#1d3557" stroke="#537aa7"/>
  <g stroke="#53d6c2" stroke-width="2" fill="#294f73">
    <rect x="829" y="190" width="39" height="30" rx="6"/><rect x="880" y="190" width="39" height="30" rx="6"/>
    <rect x="829" y="235" width="39" height="30" rx="6"/><rect x="880" y="235" width="39" height="30" rx="6"/>
    <path d="M868 205 L880 205 M868 250 L880 250 M848 220 L848 235 M899 220 L899 235"/>
  </g>
  <text x="893" y="158" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Transmon tile</text>
  <text x="893" y="290" text-anchor="middle" fill="#b8cbe1" font-size="12">Proposed: 12 modes / 22 links</text>
  <path d="M1001 228 L1030 228" stroke="#a6bddb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1040" y="132" width="116" height="192" rx="17" fill="#203e4a" stroke="#53d6c2"/>
  <circle cx="1098" cy="215" r="29" fill="none" stroke="#53d6c2" stroke-width="4"/>
  <path d="M1084 216 L1095 227 L1115 200" fill="none" stroke="#53d6c2" stroke-width="4" stroke-linecap="round"/>
  <text x="1098" y="158" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Measured</text>
  <text x="1098" y="269" text-anchor="middle" fill="#b8cbe1" font-size="12">Future gate</text>
</g>
<rect x="50" y="354" width="1100" height="42" rx="12" fill="#233c55" stroke="#3f5c7d"/>
<text x="600" y="380" text-anchor="middle" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="14">Current evidence reaches the numerical three-mode gate model; circuit feasibility and experimental gates remain open.</text>
</svg>
