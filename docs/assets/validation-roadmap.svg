<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">RFT-QPU validation roadmap</title>
<desc id="desc">Five sequential engineering gates: numerical model, circuit feasibility, single-cell chip, two-cell entangler and modular scaling, with later gates still open.</desc>
<rect width="1100" height="330" rx="24" fill="#121f35"/>
<text x="46" y="50" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Validation roadmap</text>
<text x="46" y="77" fill="#aebed4" font-family="Arial,sans-serif" font-size="14">A staged acceptance path — model completion does not skip device gates</text>
<g font-family="Arial,sans-serif">
<path d="M120 176 L978 176" stroke="#49627f" stroke-width="5"/>
<g transform="translate(92 176)">
<circle r="30" fill="#1e716c" stroke="#53d6c2" stroke-width="3"/><path d="M-13 0 L-4 9 L14 -11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="0" y="59" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Gate 0</text><text x="0" y="81" text-anchor="middle" fill="#b6c8df" font-size="12">Numerical model</text><text x="0" y="99" text-anchor="middle" fill="#53d6c2" font-size="11">Recorded</text>
</g>
<g transform="translate(320 176)">
<circle r="30" fill="#473c2b" stroke="#e6b65d" stroke-width="3"/><text x="0" y="8" text-anchor="middle" fill="#ffe4a8" font-size="25" font-weight="700">!</text>
<text x="0" y="59" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Gate 1</text><text x="0" y="81" text-anchor="middle" fill="#b6c8df" font-size="12">Circuit feasibility</text><text x="0" y="99" text-anchor="middle" fill="#e6b65d" font-size="11">Open blocker</text>
</g>
<g transform="translate(548 176)">
<circle r="30" fill="#273b59" stroke="#8caeff" stroke-width="3"/><text x="0" y="8" text-anchor="middle" fill="#dbe7ff" font-size="23">2</text>
<text x="0" y="59" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Gate 2</text><text x="0" y="81" text-anchor="middle" fill="#b6c8df" font-size="12">One-cell chip</text><text x="0" y="99" text-anchor="middle" fill="#8caeff" font-size="11">Not built</text>
</g>
<g transform="translate(776 176)">
<circle r="30" fill="#273b59" stroke="#8caeff" stroke-width="3"/><text x="0" y="8" text-anchor="middle" fill="#dbe7ff" font-size="23">3</text>
<text x="0" y="59" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Gate 3</text><text x="0" y="81" text-anchor="middle" fill="#b6c8df" font-size="12">Two-cell gate</text><text x="0" y="99" text-anchor="middle" fill="#8caeff" font-size="11">Projection only</text>
</g>
<g transform="translate(1004 176)">
<circle r="30" fill="#273b59" stroke="#8caeff" stroke-width="3"/><text x="0" y="8" text-anchor="middle" fill="#dbe7ff" font-size="23">4</text>
<text x="0" y="59" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Gate 4</text><text x="0" y="81" text-anchor="middle" fill="#b6c8df" font-size="12">Modular scaling</text><text x="0" y="99" text-anchor="middle" fill="#8caeff" font-size="11">Future work</text>
</g>
</g>
<text x="550" y="302" text-anchor="middle" fill="#aebed4" font-family="Arial,sans-serif" font-size="13">The current blocker is the resonant complex Z-link and an uncleared simultaneous pump allocation.</text>
</svg>
