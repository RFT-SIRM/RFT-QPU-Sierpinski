[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rft-qpu-prototype"
version = "0.1.0"
description = "Reproducible engineering model and hardware mapping for an SG SU(2) logical-qubit demonstrator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
rft-qpu-analyze = "rft_qpu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
