<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#fbfcfe"/>
  <text x="54" y="54" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#152238">RFT-SG level-1 transmon demonstrator</text>
  <text x="54" y="88" font-family="Arial,sans-serif" font-size="17" fill="#43536b">6 graph sites · 9 graph edges · 3 noncommuting SU(2) face links · 12 transmons</text>

  <!-- The three small SG triangles. -->
  <g fill="none" stroke="#8794a7" stroke-width="7" stroke-linecap="round">
    <!-- lower-left face -->
    <path d="M250 650 L500 650"/>
    <path d="M250 650 L250 400"/>
    <path d="M500 650 L250 400"/>
    <!-- lower-right face -->
    <path d="M500 650 L750 650"/>
    <path d="M500 650 L500 400"/>
    <path d="M750 650 L500 400"/>
    <!-- upper-left face -->
    <path d="M250 400 L500 400"/>
    <path d="M250 400 L250 150"/>
    <path d="M500 400 L250 150"/>
  </g>
  <!-- Active flux/transport edges overlay their identity-grey base. -->
  <g fill="none" stroke-width="10" stroke-linecap="round">
    <path d="M250 650 L500 650" stroke="#d14b45"/>
    <path d="M500 650 L750 650" stroke="#2d8a5b"/>
    <path d="M250 400 L500 400" stroke="#376fc5"/>
  </g>

  <!-- Each graph vertex is a dual-rail pair of transmon modes. -->
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(250 650)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v0</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q0↑</text><text x="30" y="18" font-size="13" fill="#233d62">q0↓</text>
    </g>
    <g transform="translate(500 650)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v1</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q1↑</text><text x="30" y="18" font-size="13" fill="#233d62">q1↓</text>
    </g>
    <g transform="translate(750 650)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v3</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q3↑</text><text x="30" y="18" font-size="13" fill="#233d62">q3↓</text>
    </g>
    <g transform="translate(250 400)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v2</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q2↑</text><text x="30" y="18" font-size="13" fill="#233d62">q2↓</text>
    </g>
    <g transform="translate(500 400)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v4</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q4↑</text><text x="30" y="18" font-size="13" fill="#233d62">q4↓</text>
    </g>
    <g transform="translate(250 150)">
      <rect x="-68" y="-40" width="136" height="80" rx="13" fill="#fff" stroke="#1d2d45" stroke-width="2.4"/>
      <text x="0" y="-12" font-size="17" font-weight="700" fill="#152238">Site v5</text>
      <rect x="-56" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/><rect x="4" y="-2" width="52" height="30" rx="6" fill="#eaf0f8"/>
      <text x="-30" y="18" font-size="13" fill="#233d62">q5↑</text><text x="30" y="18" font-size="13" fill="#233d62">q5↓</text>
    </g>
  </g>

  <g font-family="Arial,sans-serif">
    <rect x="900" y="150" width="250" height="300" rx="17" fill="#fff" stroke="#c7d1de" stroke-width="2"/>
    <text x="930" y="190" font-size="21" font-weight="700" fill="#152238">Link types</text>
    <line x1="930" y1="235" x2="985" y2="235" stroke="#d14b45" stroke-width="9" stroke-linecap="round"/><text x="1003" y="241" font-size="17" fill="#24364e">X transport</text>
    <line x1="930" y1="285" x2="985" y2="285" stroke="#2d8a5b" stroke-width="9" stroke-linecap="round"/><text x="1003" y="291" font-size="17" fill="#24364e">Y transport</text>
    <line x1="930" y1="335" x2="985" y2="335" stroke="#376fc5" stroke-width="9" stroke-linecap="round"/><text x="1003" y="341" font-size="17" fill="#24364e">Z transport</text>
    <line x1="930" y1="385" x2="985" y2="385" stroke="#8794a7" stroke-width="7" stroke-linecap="round"/><text x="1003" y="391" font-size="17" fill="#24364e">Identity link</text>
    <text x="930" y="425" font-size="13" fill="#5b6c83">Each site is a dual-rail pair.</text>
  </g>
  <rect x="54" y="735" width="1096" height="42" rx="11" fill="#edf2f8"/>
  <text x="75" y="762" font-family="Arial,sans-serif" font-size="16" fill="#24364e">Candidate logical qubit: lowest two-dimensional eigenspace of the 12-mode single-excitation Hamiltonian.</text>
</svg>
