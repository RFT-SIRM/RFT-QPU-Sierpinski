[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
version = "0.1.0"
name = "rft-qpu-sierpinski"
description = "Research simulator core for a gauge-covariant fractal SU(2) quantum-processing architecture"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
